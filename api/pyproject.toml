[project]
name = "healthbuddy"
version = "0.1.0"
description = "Indian family nutrition coach API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic[email]>=2.9",
  "python-multipart>=0.0.20",
  "google-genai>=1.30",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
